services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: noetix-backend
    ports:
      - "${BACKEND_HOST:-0.0.0.0}:${BACKEND_PORT:-8001}:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
    volumes:
      - ./knowledge.config:/app/knowledge.config:ro
      - ./knowledge/knowledge_bases:/app/knowledge_bases
      - ./knowledge/library:/app/library
      - ./knowledge/uploads:/app/uploads
      - ./knowledge/data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  neo4j:
    image: neo4j:5.15-community
    container_name: noetix-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/noetix_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    profiles:
      - neo4j
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
