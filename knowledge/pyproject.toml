[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noetix-knowledge"
version = "0.1.0"
description = "Noetix knowledge backend — KB management, content pipeline, and MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "kokoro>=0.3",
    "lancedb>=0.6",
    "openai>=1.30",
    "mcp>=1.0",
    "pymupdf>=1.24",
    "pydub>=0.25",
    "soundfile>=0.12",
    "numpy",
    "aiofiles>=24.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.7",
    "tiktoken>=0.7",
    "easyocr>=1.7",
    "faster-whisper>=1.0",
    "reportlab>=4.0",
    "neo4j>=5.0",
    "yt-dlp>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

# tomllib is in stdlib for 3.11+, fallback for older
compat = [
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
